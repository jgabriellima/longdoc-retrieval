[project]
name = "longdoc-retrieval"
version = "0.1.0"
description = "Long-document retrieval without embeddings: deterministic sparse search plus an agentic loop that decides what to read."
requires-python = ">=3.11,<4.0"
readme = "README.md"
authors = [
    { name="Joao Gabriel Lima", email="joaogabriellima.eng@gmail.com" },
]
dependencies = [
    "pydantic>=2.9,<3.0",
]

[project.optional-dependencies]
agent = [
    "langgraph==1.2.11",
    "langchain-core==1.6.2",
    "langgraph-checkpoint==4.2.0",
    "langgraph-prebuilt==1.1.0",
    "langgraph-sdk==0.4.4",
    "langchain-anthropic==1.7.1",
    "langchain-openai==1.6.1",
    "python-dotenv>=1.0,<2",
]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "python-dotenv>=1.0,<2",
]
langgraph-cli = [
    "langgraph-cli[inmem]==0.4.31",
]
tantivy = [
    "tantivy==0.26.0",
]

[project.scripts]
longdoc = "longdoc_retrieval.cli:entrypoint"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
packages = ["longdoc_retrieval"]
