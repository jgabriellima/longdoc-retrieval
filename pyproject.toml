[project]
name = "longdoc-retrieval"
version = "0.1.0"
description = "Long-document retrieval without embeddings: deterministic sparse search plus an agentic loop that decides what to read."
requires-python = ">=3.11,<4.0"
readme = "README.md"
authors = [
    { name="Joao Gabriel Lima", email="joaogabriellima.eng@gmail.com" },
]
dependencies = [
    "pydantic>=2.9,<3.0",
]

[project.optional-dependencies]
# For the LangGraph-based agentic retrieval loop (graph/). Not imported by
# the deterministic retrieval layer (domain/, ingestion/, indexes/,
# retrieval/, api/), which has no dependency beyond pydantic.
# Versions verified against live PyPI dependency metadata - see VERSIONS.md
# for the full compatibility chain.
agent = [
    "langgraph==1.2.11",
    "langchain-core==1.6.2",
    "langgraph-checkpoint==4.2.0",
    "langgraph-prebuilt==1.1.0",
    "langgraph-sdk==0.4.4",
    "langchain-anthropic==1.7.1",
    "langchain-openai==1.6.1",
]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "python-dotenv>=1.0,<2",
]
# `langgraph dev` local server + LangGraph Studio, for interactive
# execution/evaluation of the retrieval agent (graph/dev.py). Verified
# against PyPI metadata: langgraph-cli 0.4.31's [inmem] extra requires
# langgraph-api<1.0.0,>=0.5.35 and langgraph-runtime-inmem>=0.7;
# langgraph-api 0.14.0 requires langchain-core>=0.3.64,
# langgraph-checkpoint<5,>=3.0.1, langgraph-sdk>=0.4.4, langgraph<2,>=0.4.10
# - all satisfied by the `agent` extra's pins above.
langgraph-cli = [
    "langgraph-cli[inmem]==0.4.31",
]
# Alternate sparse-retrieval backend (indexes/sparse_tantivy.py) - an
# implementation of the same SparseBackend interface as the default SQLite
# FTS5 one, picked at RetrievalService construction time. Verified against
# live PyPI metadata: tantivy 0.26.0 requires_python >=3.10, zero runtime
# dependencies (compiled wheel; its only declared extra is `nox`, for its
# own dev/test tooling).
tantivy = [
    "tantivy==0.26.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
packages = ["longdoc_retrieval"]
